name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        # 跳过依赖真实桌面会话的全屏截图测试（本地可完整运行）
        run: cargo test --all-targets -- --skip capture_fullscreen_matches_virtual_screen_and_saves_png

      - name: Release build
        run: cargo build --release

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # 屏幕录制 / 托盘 / 全局热键属于系统级能力，CI 中不覆盖，
      # 这里只运行与文件、像素、配置相关的逻辑测试。
      - name: Tests
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

      - name: Package .app
        run: bash scripts/package-macos.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCapture-macos
          path: dist/ScreenCapture-*-macos-*.zip
